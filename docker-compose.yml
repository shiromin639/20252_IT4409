services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sql:/docker-entrypoint-initdb.d/init-multiple-databases.sql
    networks:
      - ecommerce-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-network

  product-service:
    build:
      context: ./backend/product-fastapi
    container_name: ecommerce-product
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=product
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts
    command: /bin/bash /scripts/start-fastapi.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  order-service:
    build:
      context: ./backend/order-fastapi
    container_name: ecommerce-order
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=order
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_PAYMENT_URL=${VNPAY_PAYMENT_URL}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${SMTP_FROM}
      - FRONTEND_URL=${FRONTEND_URL}
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts
    command: /bin/bash /scripts/start-fastapi.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  cart-service:
    build:
      context: ./backend/cart-fastapi
    container_name: ecommerce-cart
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=cart
      - POSTGRES_PORT=5432
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts
    command: /bin/bash /scripts/start-fastapi.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  inventory-service:
    build:
      context: ./backend/inventory-fastapi
    container_name: ecommerce-inventory
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=inventory
      - POSTGRES_PORT=5432
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts
    command: /bin/bash /scripts/start-fastapi.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  user-service:
    build:
      context: ./backend/user-fastapi
    container_name: ecommerce-user
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=user
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped
    volumes:
      - ./scripts:/scripts
    command: /bin/bash /scripts/start-fastapi.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network


  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: ecommerce-api-gateway
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - INVENTORY_SERVICE_URL=http://inventory-service:8000
      - CART_SERVICE_URL=http://cart-service:8000
      - ORDER_SERVICE_URL=http://order-service:8000
      - USER_SERVICE_URL=http://user-service:8000
      - FRONTEND_URL=${FRONTEND_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - product-service
      - inventory-service
      - cart-service
      - order-service
      - user-service
    networks:
      - ecommerce-network

  frontend:
    build:
      context: ./frontend
      args:
        # Pass the gateway URL to the Vite build so it gets baked into the frontend
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/v1}
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
